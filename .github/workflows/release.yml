name: release

# Pushing a tag vX.Y.Z builds both platforms and publishes a GitHub release with
# librarian-X.Y.Z-linux-x86_64.tar.gz and librarian-X.Y.Z-windows-x86_64.zip,
# plus the bare executables librarian-X.Y.Z-linux-x86_64 and
# librarian-X.Y.Z-windows-x86_64.exe.
# The winget manifest under packaging/winget/ is then updated from the zip's
# SHA256 (see packaging/winget/README.md). Models are not bundled: the first
# `librarian setup` downloads them.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04 # older glibc, so the binary runs on more distributions
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - run: |
          ./setup.sh
          make release
          v="${GITHUB_REF_NAME#v}"; d="librarian-$v-linux-x86_64"
          mkdir "$d" && cp bin/librarian README.md LICENSE librarian.toml "$d/"
          tar czf "$d.tar.gz" "$d"
          cp bin/librarian "$d-bin" # renamed in publish; $d is the directory
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            librarian-*-linux-x86_64.tar.gz
            librarian-*-linux-x86_64-bin

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            make git curl unzip zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - run: |
          SKIP_LLAMA_BUILD=1 ./setup.sh
          make windows
          v="${GITHUB_REF_NAME#v}"; d="librarian-$v-windows-x86_64"
          mkdir "$d" && cp bin/librarian.exe README.md LICENSE librarian.toml "$d/"
          zip -qr "$d.zip" "$d"
          cp bin/librarian.exe "$d.exe"
          sha256sum "$d.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            librarian-*-windows-x86_64.zip
            librarian-*-windows-x86_64.exe

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - run: |
          for f in librarian-*-bin; do mv "$f" "${f%-bin}"; done
          sha256sum librarian-* > SHA256SUMS
          cat SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes librarian-* SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
