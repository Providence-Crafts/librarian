ShortDescription: Local question answering over your own documents, with cited answers.
Description: |-
  librarian indexes your documents into SQLite with a local GGUF embedding model and
  answers questions about them with a local GGUF language model, citing the passages
  it used and refusing when retrieval is too weak. One static binary, no server, no
  network after `librarian setup` downloads the models.
